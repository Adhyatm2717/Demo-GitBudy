<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Nova</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark">N</div>
      <p class="eyebrow">WELCOME BACK</p>
      <h1 id="login-title">Sign in to Nova</h1>
      <p class="subtitle">Enter your details to access your account.</p>

      <form id="login-form" novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email"
               placeholder="you@example.com" autocomplete="email" required />
        <small class="error" id="email-error"></small>

        <div class="password-heading">
          <label for="password">Password</label>
          <a href="#" id="forgot-link">Forgot password?</a>
        </div>
        <div class="password-wrap">
          <input id="password" name="password" type="password"
                 placeholder="Enter your password" autocomplete="current-password" required />
          <button class="toggle-password" id="toggle-password" type="button"
                  aria-label="Show password">Show</button>
        </div>
        <small class="error" id="password-error"></small>

        <button class="submit-button" type="submit">Sign in <span>→</span></button>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      </form>

      <div class="divider"><span>OR CONTINUE WITH</span></div>
      <button class="google-button" id="google-button" type="button">
        <span class="google-g">G</span> Continue with Google
      </button>

      <p class="signup-text">Don't have an account? <a href="#">Create account</a></p>
      <p class="terms">By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
    </section>
    <footer>© 2026 Nova. All rights reserved.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
